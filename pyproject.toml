[project]
name = "pocket-tts-openapi"
version = "0.1.1"
description = "PocketTTS with OpenAI compatible API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pocket-tts>=3.3.0,<3.4.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.2.1",
    "soundfile>=0.13.1",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.35.0",
    "torch>=2.5.0",
    "numpy>=2.0",
    "safetensors>=0.4.0",
    "anyio>=3.7.0",
    "huggingface_hub>=0.20.0",
]

[tool.setuptools]
py-modules = ["pocketapi", "config"]

[tool.setuptools.packages.find]
include = ["pocket_tts_server*"]
